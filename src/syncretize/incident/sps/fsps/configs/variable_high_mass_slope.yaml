# FSPS variable-IMF grid configuration
#
# This file defines a contiguous broken power-law initial mass function:
#
#     dN/dM proportional to M^(-alpha_i)
#
# Slopes are ordered. Each slope applies between the mass boundaries at the
# same position and the next position. Four boundaries therefore require three
# slopes. FSPS imf_type=2 fixes the two internal boundaries at 0.5 and 1.0 Msun;
# its lower and upper limits and all three slopes remain configurable.
#
# Every entry under `mass_boundaries` and `slopes` has these fields:
#
#   name:
#     Human-readable parameter identifier stored in grid metadata when varied.
#
#   fixed_value:
#     Value used when `vary_axis` is false. For a varied parameter this is the
#     nominal/reference value used in the canonical filename and metadata. It
#     must lie within the configured axis.
#
#   vary_axis:
#     Set true to make this parameter an additional Synthesizer grid axis.
#     Current production policy permits at most one true value in this file.
#     Setting every entry false creates a normal age-metallicity grid.
#
# A varied parameter must also contain an `axis` mapping with `name` and one of
# the two sampling forms below. The forms are mutually exclusive.
#
# Explicit values use ordinary YAML list syntax and are preferred for released
# grids because every stored value is visible during review:
#
#   axis:
#     name: property_name_used_by_synthesizer
#     log_on_read: false
#     values:
#       - 1.3
#       - 2.3
#       - 3.0
#
# Generated sampling includes both limits exactly. `spacing` may be `linear`
# or `log`; logarithmic spacing requires positive limits:
#
#   axis:
#     name: property_name_used_by_synthesizer
#     log_on_read: false
#     range:
#       minimum: 1.3
#       maximum: 3.0
#       number: 18
#       spacing: linear
#
# `log_on_read` controls interpolation coordinates in Synthesizer. It is
# separate from sampling spacing and defaults to false.
# Slope axes are dimensionless; mass-boundary axis values are interpreted as
# solar masses and written with Msun units.

model:
  sps_version: "4.0"
  imf_type: bpl

imf:
  mass_boundaries:
    - name: lower_mass
      fixed_value: 0.08
      vary_axis: false

    - name: low_mass_break
      fixed_value: 0.5
      vary_axis: false

    - name: high_mass_break
      fixed_value: 1.0
      vary_axis: false

    - name: upper_mass
      fixed_value: 120.0
      vary_axis: false

  slopes:
    - name: low_mass_slope
      fixed_value: 1.3
      vary_axis: false

    - name: intermediate_mass_slope
      fixed_value: 2.3
      vary_axis: false

    - name: high_mass_slope
      fixed_value: 2.3
      vary_axis: true
      axis:
        name: imf_high_mass_slope
        log_on_read: false
        values:
          - 1.3
          - 1.4
          - 1.5
          - 1.6
          - 1.7
          - 1.8
          - 1.9
          - 2.0
          - 2.1
          - 2.2
          - 2.3
          - 2.4
          - 2.5
          - 2.6
          - 2.7
          - 2.8
          - 2.9
          - 3.0
